[package]
name = "studia"
version = "0.1.0"
description = "Studia - Tu asistente de estudio"
authors = ["you"]
edition = "2021"
default-run = "studia"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "tauri_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
rand = "0.8"
windows-sys = { version = "0.52", features = ["Win32_Foundation", "Win32_System_Pipes", "Win32_Security", "Win32_Security_Authorization", "Win32_Storage_FileSystem", "Win32_System_IO", "Win32_System_Threading", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging", "Win32_System_Com", "Win32_System_Registry"] }

tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sysinfo = "0.39.6"
tokio = { version = "1.53.2", features = ["sync", "time"] }
tauri-plugin-dialog = "^2.0.0"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }



# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true

[[bin]]
name = "studia-helper"
path = "src/bin/studia-helper.rs"
