<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tauri + React + Typescript</title>
    <script>
      (function() {
        try {
          var savedTheme = localStorage.getItem('studia_theme');
          var theme = (savedTheme === 'blue') ? 'blue' : 'rose';
          document.documentElement.setAttribute('data-theme', theme);

          var savedApp = localStorage.getItem('studia_appearance');
          var appearance = (savedApp === 'light' || savedApp === 'dark' || savedApp === 'system')
            ? savedApp
            : 'system';

          var isDark = false;
          if (appearance === 'dark') {
            isDark = true;
          } else if (appearance === 'system') {
            isDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
          }

          document.documentElement.setAttribute('data-color-scheme', isDark ? 'dark' : 'light');
        } catch (e) {
          document.documentElement.setAttribute('data-theme', 'rose');
          document.documentElement.setAttribute('data-color-scheme', 'light');
        }
      })();
    </script>
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
